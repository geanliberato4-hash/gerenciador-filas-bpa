<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dados do Motorista • BPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/senha.css">
</head>

<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <main class="container">

    <div class="card" id="cardForm">

      <header class="card-header">
        <h1 id="tituloAtendimento"></h1>
        <p>Informe seus dados para gerar a senha</p>
      </header>

      <form class="card-body" id="formSenha" autocomplete="off" novalidate>
        <input id="nome" type="text" placeholder="Nome do motorista" class="input" maxlength="40" autofocus>
        <input id="placa" type="text" placeholder="Placa do veículo" class="input input-placa" autocapitalize="characters" inputmode="text">
        <small class="dica-placa">Padrão antigo ABC1234 ou Mercosul ABC1D23</small>

        <button class="btn-fila btn-gerar" id="btnGerar" type="submit">
          Gerar senha
        </button>

        <a href="senha.html" class="link-voltar">← Voltar</a>

        <div id="msg" class="msg" role="alert" style="display:none;"></div>
      </form>

    </div>

    <!-- CONFIRMAÇÃO -->
    <div class="card oculto" id="cardOk">
      <div class="ok-icone">✔</div>
      <h1 class="ok-titulo">Senha gerada!</h1>
      <p class="ok-dados" id="okDados"></p>
      <p class="ok-texto">Aguarde. Você será chamado pelo nome e placa no painel.</p>
    </div>

    <footer class="footer">
      <span>Sistema de filas inteligente • BPA</span>
    </footer>

  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/config.js"></script>

  <script>
    const atendimento = localStorage.getItem("atendimentoKey");
    const titulo = document.getElementById("tituloAtendimento");
    const msg = document.getElementById("msg");
    const form = document.getElementById("formSenha");
    const btnGerar = document.getElementById("btnGerar");
    const nomeInput = document.getElementById("nome");
    const placaInput = document.getElementById("placa");

    if (!atendimento) {
      window.location.href = "senha.html";
    } else {
      titulo.innerText = localStorage.getItem("atendimentoNome") || "Atendimento";
    }

    /* ================= PLACA =================
       Aceita somente:
       - Padrão antigo:   ABC1234  (3 letras + 4 números)
       - Padrão Mercosul: ABC1D23  (3 letras + 1 número + 1 letra + 2 números)
    */
    const PLACA_ANTIGA = /^[A-Z]{3}[0-9]{4}$/;
    const PLACA_MERCOSUL = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;

    function placaValida(p) {
      return PLACA_ANTIGA.test(p) || PLACA_MERCOSUL.test(p);
    }

    // Enquanto digita, só deixa entrar o caractere certo em cada posição
    function filtrarPlaca(texto) {
      const chars = texto.toUpperCase().replace(/[^A-Z0-9]/g, "");
      let out = "";
      for (const c of chars) {
        const i = out.length;
        if (i >= 7) break;
        const letra = /[A-Z]/.test(c);
        const numero = /[0-9]/.test(c);
        if (i <= 2 && letra) out += c;              // posições 1-3: letras
        else if (i === 3 && numero) out += c;       // posição 4: número
        else if (i === 4 && (letra || numero)) out += c; // posição 5: letra (Mercosul) ou número (antiga)
        else if (i >= 5 && numero) out += c;        // posições 6-7: números
      }
      return out;
    }

    placaInput.addEventListener("input", () => {
      placaInput.value = filtrarPlaca(placaInput.value);
      placaInput.classList.toggle("invalida", placaInput.value.length === 7 && !placaValida(placaInput.value));
      placaInput.classList.toggle("valida", placaValida(placaInput.value));
    });

    let enviando = false;

    form.addEventListener("submit", e => {
      e.preventDefault();
      gerarSenha();
    });

    function gerarSenha() {
      if (enviando) return; // evita senha duplicada com clique duplo

      const nome = nomeInput.value.trim().replace(/\s+/g, " ");
      const placa = filtrarPlaca(placaInput.value);

      if (!nome || !placa) {
        mostrarMensagem("Preencha todos os campos");
        (!nome ? nomeInput : placaInput).focus();
        return;
      }

      if (!placaValida(placa)) {
        mostrarMensagem("Placa inválida. Use o padrão ABC1234 ou Mercosul ABC1D23");
        placaInput.focus();
        return;
      }

      enviando = true;
      btnGerar.disabled = true;
      btnGerar.innerText = "Gerando…";

      const senha = {
        nome,
        placa,
        atendimento,
        status: "aguardando",
        criadoEm: firebase.database.ServerValue.TIMESTAMP // hora do servidor (não depende do relógio do totem)
      };

      const refSenhas = db.ref(`unidades/${UNIDADE}/senhas`);

      // Não deixa a mesma placa ter duas senhas ativas
      refSenhas.once("value")
        .then(snap => {
          let existente = null;
          snap.forEach(c => {
            const s = c.val();
            if (s && String(s.placa || "").toUpperCase().replace(/[^A-Z0-9]/g, "") === placa &&
                (s.status === "aguardando" || s.status === "chamando")) {
              existente = s;
              return true;
            }
          });

          if (existente) {
            const err = new Error("duplicada");
            err.duplicada = existente;
            throw err;
          }
          return refSenhas.push(senha);
        })
        .then(() => {
          mostrarConfirmacao(nome, placa);
        })
        .catch(err => {
          if (err && err.duplicada) {
            mostrarMensagem(
              err.duplicada.status === "chamando"
                ? `A placa ${placa} já está sendo chamada no ${err.duplicada.guiche || "guichê"}.`
                : `A placa ${placa} já possui uma senha na fila. Aguarde ser chamado.`
            );
          } else {
            console.error(err);
            mostrarMensagem("Não foi possível gerar a senha. Tente novamente.");
          }
          enviando = false;
          btnGerar.disabled = false;
          btnGerar.innerText = "Gerar senha";
        });
    }

    function mostrarConfirmacao(nome, placa) {
      document.getElementById("cardForm").classList.add("oculto");
      document.getElementById("cardOk").classList.remove("oculto");
      document.getElementById("okDados").innerText = `${nome} • ${placa}`;

      setTimeout(() => {
        localStorage.removeItem("atendimentoKey");
        localStorage.removeItem("atendimentoNome");
        window.location.href = "senha.html";
      }, 5000);
    }

    function mostrarMensagem(texto) {
      msg.innerText = texto;
      msg.style.display = "block";

      clearTimeout(mostrarMensagem.t);
      mostrarMensagem.t = setTimeout(() => {
        msg.style.display = "none";
      }, 5000);
    }
  </script>

</body>
</html>
