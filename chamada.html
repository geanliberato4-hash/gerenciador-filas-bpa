  <title>Chamada de Senhas • BPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: 'Poppins', Arial, sans-serif;
      color: #fff;
      cursor: none;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.12);
      transition: background .6s ease;
    }

    /* escurece só enquanto uma chamada está na tela (para destacar o nome) */
    body.chamando .overlay { background: rgba(0,0,0,0.6); }

    /* RELÓGIO */
    .relogio {
      position: fixed;
      top: 3vh;
      right: 3vw;
      font-size: 4vh;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,.7);
      z-index: 5;
    }

    /* CHAMADA */
    .chamada {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
    }

    .card {
      background: rgba(0,0,0,0.8);
      padding: 6vh 7vw;
      border-radius: 32px;
      border: 4px solid rgba(108,255,154,.6);
      box-shadow: 0 30px 80px rgba(0,0,0,.7);
      max-width: 100%;
      min-width: min(55vw, 100%);
      animation: entrar .6s cubic-bezier(.2,1.4,.4,1), pulsar 1.2s ease 5;
    }
    .card .chamando-titulo {
      margin: 0 0 1.5vh;
      font-size: clamp(16px, 2.6vh, 30px);
      font-weight: 600;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #ffe066;
    }
    .card #placa { margin: 3vh 0; }
    /* com "Últimas chamadas" na direita, a chamada centraliza no espaço que sobra */
    body.tem-ultimas .chamada { padding: 0 calc(clamp(220px, 19vw, 340px) + 4vw) 0 3vw; }

    @keyframes entrar {
      from { transform: scale(.85); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes pulsar {
      0%, 100% { box-shadow: 0 30px 80px rgba(0,0,0,.7); border-color: rgba(108,255,154,.6); }
      50%      { box-shadow: 0 0 0 18px rgba(108,255,154,.35), 0 30px 80px rgba(0,0,0,.7); border-color: #ffe066; }
    }

    .card h1 {
      font-size: clamp(36px, 8vh, 96px);
      color: #6cff9a;
      margin: 0 0 2vh;
      word-break: break-word;
    }

    .card p {
      font-size: clamp(24px, 4.5vh, 52px);
      margin: 1vh 0;
    }

    .card .guiche {
      font-weight: 800;
      color: #ffe066;
    }

    /* ÚLTIMAS CHAMADAS (coluna na lateral direita) */
    .ultimas {
      position: fixed;
      top: 12vh;
      right: 2vw;
      width: clamp(220px, 19vw, 340px);
      display: flex;
      flex-direction: column;
      gap: 1.4vh;
      padding: 2vh 1.2vw;
      border-radius: 18px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(8px);
      z-index: 5;
    }
    .ultimas:empty { display: none; }
    .ultimas h2 {
      margin: 0 0 .4vh;
      font-size: 2.3vh;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .12em;
      opacity: .8;
      text-align: center;
    }
    .ultimas .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6vh;
      padding: 1.2vh .8vw;
      border-radius: 12px;
      background: rgba(255,255,255,.07);
      font-size: 2vh;
      text-align: center;
    }
    .ultimas .item:first-of-type { background: rgba(108,255,154,.14); }
    .ultimas .item .placa-br { font-size: 2.6vh; }

    /* PLACA DESENHADA (Mercosul ou modelo antigo) */
    .placa-br {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      font-size: clamp(30px, 7vh, 84px);
      line-height: 1;
      border: .06em solid #1c1c1c;
      border-radius: .14em;
      background: #fff;
      color: #111;
      overflow: hidden;
      box-shadow: 0 .12em .4em rgba(0,0,0,.5);
    }
    .placa-br .faixa {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .3em;
      padding: .07em .25em;
      background: #003399;
      color: #fff;
      font-size: .2em;
      font-weight: 600;
      letter-spacing: .25em;
    }
    .placa-br .faixa i { font-style: normal; letter-spacing: 0; }
    .placa-br .letras {
      padding: .06em .3em .04em;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: center;
      white-space: nowrap;
    }
    .placa-br.antiga { background: #c9ccd0; }
    .placa-br.antiga .faixa { background: transparent; color: #111; justify-content: center; letter-spacing: .3em; }

    /* ATIVAR SOM */
    .ativar-som {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0,0,0,.8);
      z-index: 100;
      cursor: pointer;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
    }

    .ativar-som small {
      font-size: 16px;
      font-weight: 400;
      opacity: .7;
    }
  </style>
</head>

<body>

  <!-- VÍDEO DE FUNDO -->
  <video autoplay loop muted playsinline>
    <source src="video/fundo.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="relogio" id="relogio"></div>

  <!-- CHAMADA -->
  <div class="chamada" id="chamada">
    <div class="card" id="card">
      <p class="chamando-titulo" id="chamandoTitulo">Chamando</p>
      <h1 id="nome"></h1>
      <p id="placa"></p>
      <p id="guiche" class="guiche"></p>
    </div>
  </div>

  <!-- ÚLTIMAS CHAMADAS -->
  <div class="ultimas" id="ultimas"></div>

  <!-- Só aparece se o navegador bloquear o som (computador sem o atalho configurado) -->
  <div class="ativar-som" id="ativarSom" style="display:none">
    🔊 Toque na tela para liberar o som das chamadas
    <small>O navegador bloqueou o som. Para não aparecer mais, abra esta tela pelo atalho "abrir-tela-chamada"</small>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/atualizar.js" data-tela="tv"></script>
  <script src="js/midia.js" data-tela="tv"></script>
  <script src="js/recado.js" data-tela="tv"></script>
  <script src="js/manter-tela.js"></script>
  <script src="js/chamada.js"></script>

</body>
